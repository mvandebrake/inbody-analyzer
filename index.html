<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4472C4">
  <title>InBody Analyzer</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f5f5f5; color: #333; padding: 16px; }
    .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
    .header { background: linear-gradient(135deg, #4472C4 0%, #2E5090 100%); color: white; padding: 24px 20px; text-align: center; }
    .header h1 { font-size: 24px; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.9; }
    .content { padding: 24px 20px; }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .upload-btn { padding: 20px 16px; border: 2px solid #4472C4; background: white; border-radius: 8px; cursor: pointer; font-weight: 600; color: #4472C4; font-size: 14px; text-align: center; transition: all 0.2s; }
    .upload-btn:active { background: #e8f0ff; transform: scale(0.98); }
    .upload-icon { font-size: 28px; margin-bottom: 6px; }
    input[type="file"] { display: none; }
    .preview { display: none; margin-bottom: 20px; }
    .preview img { width: 100%; border-radius: 8px; max-height: 400px; object-fit: contain; }
    .btn-analyze { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #4472C4; color: white; font-weight: 600; font-size: 16px; cursor: pointer; display: none; margin-bottom: 12px; }
    .loading { display: none; text-align: center; padding: 20px; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4472C4; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .results { display: none; background: #e8f0ff; border: 1px solid #cce0ff; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .results h3 { font-size: 14px; margin-bottom: 12px; color: #2E5090; }
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric { background: white; padding: 8px; border-radius: 4px; border-left: 3px solid #4472C4; font-size: 12px; }
    .metric-label { font-size: 10px; color: #666; text-transform: uppercase; }
    .metric-value { font-size: 15px; font-weight: 600; color: #2E5090; margin-top: 2px; }
    .button-group { display: flex; gap: 8px; }
    .button-group button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: none; }
    .btn-download { background: #27AE60; color: white; }
    .btn-reset { background: #e8e8e8; color: #333; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>InBody Analyzer</h1>
    <p>Scan → Extract → Generate Reports</p>
  </div>
  <div class="content">
    <div class="button-row">
      <button type="button" class="upload-btn" id="cameraBtn"><div class="upload-icon">📷</div>Take Photo</button>
      <button type="button" class="upload-btn" id="galleryBtn"><div class="upload-icon">📁</div>Choose File</button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <input type="file" id="galleryInput" accept="image/*">
    <div class="preview" id="preview"><img id="previewImg" alt="Preview"></div>
    <button type="button" class="btn-analyze" id="analyzeBtn">Analyze Scan</button>
    <div class="loading" id="loading"><div class="spinner"></div><p>Analyzing...</p></div>
    <div class="results" id="results"><h3>Extracted Data</h3><div class="metrics-grid" id="metricsGrid"></div></div>
    <div class="button-group">
      <button type="button" class="btn-download" id="downloadBtn">Download Report</button>
      <button type="button" class="btn-reset" id="resetBtn">New Scan</button>
    </div>
  </div>
</div>
<script>
  const cameraBtn = document.getElementById('cameraBtn');
  const galleryBtn = document.getElementById('galleryBtn');
  const cameraInput = document.getElementById('cameraInput');
  const galleryInput = document.getElementById('galleryInput');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');
  const metricsGrid = document.getElementById('metricsGrid');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');
  let selectedFile = null;
  let extractedMetrics = null;
  cameraBtn.onclick = function(e) { e.preventDefault(); cameraInput.click(); };
  galleryBtn.onclick = function(e) { e.preventDefault(); galleryInput.click(); };
  cameraInput.onchange = function() { if (this.files && this.files[0]) { selectedFile = this.files[0]; showPreview(); } };
  galleryInput.onchange = function() { if (this.files && this.files[0]) { selectedFile = this.files[0]; showPreview(); } };
  function showPreview() { const reader = new FileReader(); reader.onload = function(e) { previewImg.src = e.target.result; preview.style.display = 'block'; analyzeBtn.style.display = 'block'; }; reader.readAsDataURL(selectedFile); }
  analyzeBtn.onclick = async function() { if (!selectedFile) return; loading.style.display = 'block'; analyzeBtn.style.display = 'none'; try { const base64Image = await new Promise((resolve) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.readAsDataURL(selectedFile); }); const response = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64Image } }, { type: 'text', text: `Extract InBody scan metrics. Return ONLY valid JSON: {"clientName": null, "bodyWeight": null, "skeletal_muscle": null, "body_fat_lbs": null, "body_fat_percent": null, "skeletal_muscle_percent": null, "protein_mass": null, "bmi": null, "obesity_category": null, "phase_angle": null, "tbw": null, "ecw": null, "visceral_fat_area": null, "visceral_fat_risk": null, "bmr": null, "left_arm_muscle": null, "right_arm_muscle": null, "trunk_muscle": null, "legs_muscle": null, "left_arm_fat": null, "right_arm_fat": null, "trunk_fat": null, "legs_fat": null}` }] }] }) }); const data = await response.json(); const jsonText = data.content[0].text.trim(); const jsonMatch = jsonText.match(/\{[\s\S]*\}/); if (jsonMatch) { extractedMetrics = JSON.parse(jsonMatch[0]); displayMetrics(); } loading.style.display = 'none'; } catch (error) { alert('Error: ' + error.message); loading.style.display = 'none'; analyzeBtn.style.display = 'block'; } };
  function displayMetrics() { const metricsToShow = [['Weight', extractedMetrics.bodyWeight, 'lbs'], ['Body Fat %', extractedMetrics.body_fat_percent, '%'], ['Muscle', extractedMetrics.skeletal_muscle, 'lbs'], ['BMI', extractedMetrics.bmi, ''], ['Phase Angle', extractedMetrics.phase_angle, '°'], ['BMR', extractedMetrics.bmr, 'kcal']]; metricsGrid.innerHTML = ''; metricsToShow.forEach(([label, value, unit]) => { if (value !== null && value !== undefined) { const displayValue = typeof value === 'number' ? value.toFixed(1) : value; metricsGrid.innerHTML += `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${displayValue}${unit}</div></div>`; } }); results.style.display = 'block'; downloadBtn.style.display = 'block'; }
  downloadBtn.onclick = generateAndDownload;
  resetBtn.onclick = function() { selectedFile = null; extractedMetrics = null; cameraInput.value = ''; galleryInput.value = ''; preview.style.display = 'none'; previewImg.src = ''; analyzeBtn.style.display = 'none'; results.style.display = 'none'; downloadBtn.style.display = 'none'; resetBtn.style.display = 'none'; loading.style.display = 'none'; };
  function generateAndDownload() { const script = document.createElement('script'); script.src = 'https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js'; script.onload = createDocument; document.head.appendChild(script); }
  function createDocument() { const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, AlignmentType, HeadingLevel, WidthType, ShadingType } = window.docx; const headerShading = { fill: "4472C4", type: ShadingType.CLEAR }; const subHeaderShading = { fill: "D9E1F2", type: ShadingType.CLEAR }; const field = (v) => v !== null && v !== undefined ? (typeof v === 'number' ? v.toFixed(1) : v.toString()) : '_______________'; const doc = new Document({ styles: { default: { document: { run: { font: "Arial", size: 22 } } }, paragraphStyles: [{ id: "Heading1", name: "Heading 1", basedOn: "Normal", next: "Normal", quickFormat: true, run: { size: 32, bold: true, font: "Arial", color: "FFFFFF" }, paragraph: { spacing: { before: 240, after: 120 } } }, { id: "Heading2", name: "Heading 2", basedOn: "Normal", next: "Normal", quickFormat: true, run: { size: 26, bold: true, font: "Arial", color: "2F5496" }, paragraph: { spacing: { before: 180, after: 100 } } }] }, sections: [{ properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 } } }, children: [new Table({ width: { size: 9360, type: WidthType.DXA }, columnWidths: [9360], rows: [new TableRow({ children: [new TableCell({ shading: headerShading, margins: { top: 120, bottom: 120, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun({ text: "INBODY SCAN ANALYSIS & GYM TRAINING BLUEPRINT", bold: true, size: 32, color: "FFFFFF" })], alignment: AlignmentType.CENTER })] })] })] }), new Paragraph({ text: "" }), new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun("CLIENT INFORMATION")] }), new Table({ width: { size: 9360, type: WidthType.DXA }, columnWidths: [2340, 2340, 2340, 2340], rows: [new TableRow({ children: [new TableCell({ shading: subHeaderShading, width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun({ text: "Name", bold: true })] })] }), new TableCell({ width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun(field(extractedMetrics.clientName))] })] }), new TableCell({ shading: subHeaderShading, width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun({ text: "Date", bold: true })] })] }), new TableCell({ width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun(new Date().toLocaleDateString())] })] })] })] }), new Paragraph({ text: "" }), new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun("1. BODY COMPOSITION")] }), new Paragraph({ children: [new TextRun({ text: "Scan Data:", bold: true })] }), new Table({ width: { size: 9360, type: WidthType.DXA }, columnWidths: [2340, 2340, 2340, 2340], rows: [new TableRow({ children: [new TableCell({ shading: subHeaderShading, width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun({ text: "Weight", bold: true })] })] }), new TableCell({ width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun(field(extractedMetrics.bodyWeight) + " lbs")] })] }), new TableCell({ shading: subHeaderShading, width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun({ text: "Muscle", bold: true })] })] }), new TableCell({ width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun(field(extractedMetrics.skeletal_muscle) + " lbs")] })] })] }), new TableRow({ children: [new TableCell({ shading: subHeaderShading, width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun({ text: "Body Fat", bold: true })] })] }), new TableCell({ width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun(field(extractedMetrics.body_fat_lbs) + " lbs")] })] }), new TableCell({ shading: subHeaderShading, width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun({ text: "Fat %", bold: true })] })] }), new TableCell({ width: { size: 2340, type: WidthType.DXA }, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: [new Paragraph({ children: [new TextRun(field(extractedMetrics.body_fat_percent) + "%")] })] })] })] }), new Paragraph({ text: "" }), new Paragraph({ children: [new TextRun({ text: "Gym & Training Recommendations:", bold: true })] }), new Paragraph({ children: [new TextRun("_________________________________________________________________")], spacing: { after: 200 } }), new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun("NOTES")] }), new Paragraph({ children: [new TextRun("_________________________________________________________________")] })] }] }); Packer.toBuffer(doc).then(buffer => { const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `InBody_${extractedMetrics.clientName || 'Client'}_${new Date().toLocaleDateString().replace(/\//g, '-')}.docx`; a.click(); URL.revokeObjectURL(url); }); }
</script>
</body>
</html>
