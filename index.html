<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InBody Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 16px; }
    .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #4472C4; margin-top: 0; }
    button { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #4472C4; background: white; color: #4472C4; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; }
    button:active { background: #e8f0ff; }
    input { display: none; }
    img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
    .results { display: none; background: #e8f0ff; padding: 15px; border-radius: 8px; margin: 15px 0; }
    .metric { background: white; padding: 10px; margin: 5px 0; border-left: 3px solid #4472C4; }
    .loading { display: none; text-align: center; padding: 20px; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4472C4; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <h1>InBody Analyzer</h1>
  <p>Scan → Extract → Generate Reports</p>
  <button onclick="document.getElementById('fileInput').click()">📁 Choose Photo</button>
  <input type="file" id="fileInput" accept="image/*">
  <img id="preview" style="display:none;">
  <button id="analyzeBtn" style="display:none; background: #4472C4; color: white;">Analyze</button>
  <div class="loading" id="loading"><div class="spinner"></div><p>Analyzing...</p></div>
  <div class="results" id="results" style="display:none;"><h3>Data</h3><div id="metricsOutput"></div></div>
  <button id="resetBtn" style="display:none;">New Scan</button>
</div>
<script>
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const analyzeBtn = document.getElementById('analyzeBtn');
const loading = document.getElementById('loading');
const results = document.getElementById('results');
const metricsOutput = document.getElementById('metricsOutput');
const resetBtn = document.getElementById('resetBtn');
let selectedFile = null;
let extractedMetrics = null;
fileInput.onchange = function() {
  if (this.files[0]) {
    selectedFile = this.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      preview.src = e.target.result;
      preview.style.display = 'block';
      analyzeBtn.style.display = 'block';
    };
    reader.readAsDataURL(selectedFile);
  }
};
analyzeBtn.onclick = async function() {
  loading.style.display = 'block';
  analyzeBtn.style.display = 'none';
  try {
    const base64Image = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(selectedFile);
    });
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': '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'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [{
            type: 'image',
            source: { type: 'base64', media_type: 'image/jpeg', data: base64Image }
          }, {
            type: 'text',
            text: 'Extract InBody metrics. Return ONLY JSON: {"bodyWeight": null, "skeletal_muscle": null, "body_fat_percent": null, "bmi": null, "phase_angle": null, "bmr": null, "visceral_fat_area": null}'
          }]
        }]
      })
    });
    const data = await response.json();
    const jsonText = data.content[0].text;
    const jsonMatch = jsonText.match(/\{[\s\S]*\}/);
    if (jsonMatch) {
      extractedMetrics = JSON.parse(jsonMatch[0]);
      displayMetrics();
    }
    loading.style.display = 'none';
  } catch (error) {
    alert('Error: ' + error.message);
    loading.style.display = 'none';
    analyzeBtn.style.display = 'block';
  }
};
function displayMetrics() {
  const metrics = [
    ['Weight', extractedMetrics.bodyWeight, 'lbs'],
    ['Body Fat %', extractedMetrics.body_fat_percent, '%'],
    ['Muscle', extractedMetrics.skeletal_muscle, 'lbs'],
    ['BMI', extractedMetrics.bmi, ''],
    ['BMR', extractedMetrics.bmr, 'kcal']
  ];
  metricsOutput.innerHTML = '';
  metrics.forEach(([label, value, unit]) => {
    if (value !== null) {
      const v = typeof value === 'number' ? value.toFixed(1) : value;
      metricsOutput.innerHTML += `<div class="metric"><strong>${label}:</strong> ${v}${unit}</div>`;
    }
  });
  results.style.display = 'block';
}
resetBtn.onclick = function() {
  selectedFile = null;
  fileInput.value = '';
  preview.style.display = 'none';
  analyzeBtn.style.display = 'none';
  results.style.display = 'none';
  resetBtn.style.display = 'none';
  loading.style.display = 'none';
};
</script>
</body>
</html>
